name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Use newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Check that results can be read
        run: |
          swiftc FACELIFT/Models/Consult.swift ci/ConsultDecodeCheck/main.swift -o consultcheck
          ./consultcheck
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project FACELIFT.xcodeproj \
            -scheme FACELIFT \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | { grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true; }
          # pipefail makes the step fail when xcodebuild fails (grep finding nothing never does).
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
